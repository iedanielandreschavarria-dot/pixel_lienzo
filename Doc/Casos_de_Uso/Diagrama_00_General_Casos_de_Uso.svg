      .uc-rf { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; font-weight: bold; fill: #0a0808; text-anchor: middle; }
      .assoc-line { fill: none; stroke: #9a958f; stroke-width: 1.8; }
