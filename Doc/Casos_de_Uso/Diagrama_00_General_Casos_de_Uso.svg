<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0a0808; }
      .header-bar { fill: #141212; stroke: #2b2626; stroke-width: 1.5; }
