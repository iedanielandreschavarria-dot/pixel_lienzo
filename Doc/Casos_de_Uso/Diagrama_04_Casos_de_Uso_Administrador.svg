  <text x="70" y="80" class="title-main">Casos de Uso — Rol 4: Administrador (Gobierno, Finanzas y Auditoría)</text>
  <text x="70" y="106" class="title-sub">Gestión RBAC con MFA, protección de Patrimonio Histórico, comisión global, dispersión de fondos, reembolsos y auditoría</text>

