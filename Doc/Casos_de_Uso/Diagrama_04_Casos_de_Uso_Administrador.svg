    <text x="720" y="48" class="legend-text">&lt;&lt;include&gt;&gt; Obligatorio</text>
    <line x1="660" y1="64" x2="710" y2="64" class="ext-line" marker-end="url(#arrow-ext)"/>
    <text x="720" y="68" class="legend-text">&lt;&lt;extend&gt;&gt; Condicional</text>
  </g>
  <rect x="330" y="148" width="1240" height="960" class="sys-box"/>  <text x="360" y="182" class="sys-title">Sistema: Pixel &amp; Lienzo — Galería Digital del Palacio Nacional (API FastAPI + SPA React)</text>
