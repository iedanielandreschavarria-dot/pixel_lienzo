    <text x="0" y="16" class="uc-sub">PATCH /api/v1/obras/{id} (es_patrimonio)</text>
  </g>
  <g transform="translate(640, 600)">
    <ellipse cx="0" cy="0" rx="215" ry="44" fill="#142920" stroke="#4ca67a" stroke-width="2"/>
