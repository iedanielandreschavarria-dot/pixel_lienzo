<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1180" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0a0808; }
      .header-bar { fill: #141212; stroke: #2b2626; stroke-width: 1.5; }
      .sys-box { fill: #110f10; stroke: #3a2e2e; stroke-width: 2; stroke-dasharray: 8 4; rx: 14; ry: 14; }
      .title-main { font-family: 'Georgia', serif; font-size: 25px; font-weight: bold; fill: #f2ece3; }
      .title-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #9a958f; }
      .kicker { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: bold; fill: #e0472b; letter-spacing: 1.5px; }
      .sys-title { font-family: 'Georgia', serif; font-size: 16px; font-weight: bold; fill: #f2ece3; letter-spacing: 0.5px; }
      .actor-name { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: bold; fill: #f2ece3; text-anchor: middle; }
      .actor-role { font-family: 'Consolas', monospace; font-size: 11px; fill: #e0472b; text-anchor: middle; }
      .uc-code { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; text-anchor: middle; }
      .uc-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: bold; fill: #f2ece3; text-anchor: middle; }
      .uc-sub { font-family: 'Consolas', monospace; font-size: 10.5px; fill: #beb8b0; text-anchor: middle; }
      .uc-rf { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; font-weight: bold; fill: #0a0808; text-anchor: middle; }
      .assoc-line { fill: none; stroke: #9a958f; stroke-width: 1.8; }
      .inc-line { fill: none; stroke: #c9a24b; stroke-width: 1.6; stroke-dasharray: 6 4; }
      .ext-line { fill: none; stroke: #e0472b; stroke-width: 1.6; stroke-dasharray: 6 4; }
      .stereo-bg { fill: #0a0808; stroke: #2b2626; stroke-width: 1; rx: 4; ry: 4; }
      .stereo-txt { font-family: 'Consolas', monospace; font-size: 10px; font-weight: bold; text-anchor: middle; }
      .legend-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; fill: #f2ece3; }
      .footer-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #9a958f; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#151212" stroke-width="1"/>
    </pattern>
    <marker id="arrow-inc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c9a24b"/>
    </marker>
    <marker id="arrow-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e0472b"/>
    </marker>
    <marker id="arrow-act" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9a958f"/>
    </marker>
  </defs>

  <rect width="1920" height="1180" class="bg"/>
  <rect width="1920" height="1180" fill="url(#grid)"/>
  <rect x="0" y="0" width="1920" height="6" fill="#e0472b"/>

  <!-- Header -->
  <rect x="40" y="22" width="1840" height="102" rx="10" class="header-bar"/>
