    <text x="0" y="-4" class="uc-title">Crear Usuarios Internos, Roles e Inhabilitar</text>
    <text x="0" y="16" class="uc-sub">POST /usuarios · PATCH /rol · PATCH /estado</text>
  </g>
  <g transform="translate(640, 440)">
    <ellipse cx="0" cy="0" rx="215" ry="44" fill="#162436" stroke="#5c94ce" stroke-width="2"/>
